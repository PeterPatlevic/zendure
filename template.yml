############################################
# TEMPLATE-SENSOREN
############################################
template:
  - sensor:
      # Nettoleistung am Netz (positiv = Einspeisung, negativ = Bezug)
      # Bereinigt um Speichereinfluss: Entladung hat Bezug reduziert → addieren,
      # Ladung hat Bezug erhöht → abziehen. So sieht man den "wahren" Haushaltsbedarf.
      - name: "Nettoleistung Netz"
        unit_of_measurement: "W"
        state: >
          {% set netz = states('sensor.sn_3007669104_metering_power_supplied') | float(0)
                      - states('sensor.sn_3007669104_metering_power_absorbed') | float(0) %}
          {% set sp_in = states('sensor.solarflow_2400_ac_output_pack_power') | float(0) %}
          {% set sp_out  = states('sensor.solarflow_2400_ac_pack_input_power') | float(0) %}
          {{ netz - sp_out + sp_in }}

      # Prognose Stunde hoch, wenn Prognose > 1/2 Peak
      - name: "PV Prognose Stunde hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_next_hour') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 2000) }}
          {% endif %}

      # Prognose Heute hoch, wenn Prognose > Peak
      - name: "PV Prognose Heute hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_today_remaining') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 1000) }}
          {% endif %}

      # Prognose Morgen hoch, wenn Prognose > 3 x Peak
      - name: "PV Prognose Morgen hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_tomorrow') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) * 3 / 1000) }}
          {% endif %}

      # Maximale Ladeleistung (SoC)
      - name: "Zendure Max Ladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set max = float(800) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_max = states('number.solarflow_2400_ac_soc_set') | float(0) %}
          {% set pv_stunde_hoch = is_state('sensor.pv_prognose_stunde_hoch', 'True') %}
          
          {% if soc >= soc_max %}
            0
          {% elif pv_stunde_hoch and soc > 60 %}
            {{ max / 2 }}
          {% elif pv_stunde_hoch %}
            {{ max * 3 / 2 }}
          {% else %}
            {{ max }}
          {% endif %}
          
      # Maximale Entladeleistung (SoC + Prognose)
      - name: "Zendure Max Entladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set max = float(800) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_min = states('sensor.solarflow_2400_ac_min_soc') | float(0) %}
          {% set pv_stunde_hoch = is_state('sensor.pv_prognose_stunde_hoch', 'True') %}
          {% set pv_morgen_hoch = is_state('sensor.pv_prognose_morgen_hoch', 'True') %}
          
          {% if soc <= soc_min %}
            0
          {% elif pv_stunde_hoch and pv_morgen_hoch and soc > 40 %}
            {{ max }}
          {% elif pv_stunde_hoch and pv_morgen_hoch %}
            {{ max * 3 / 4 }}
          {% elif pv_stunde_hoch and soc > 50 %}
            {{ max * 2 / 3 }}
          {% elif not pv_stunde_hoch and soc > 60 %}
            {{ max / 2 }}
          {% elif not pv_stunde_hoch %}
            {{ max / 3 }}
          {% else %}
            {{ max / 4 }}
          {% endif %}

  - binary_sensor:
      # Nachtsensor - Sonnenaufgang plus 2std., Sonnenuntergang minus 3std.
      - name: "Ist Nacht"
        state: >
          {{ (states('sensor.sun_next_rising') | as_timestamp + 7200)
            < states('sensor.sun_next_setting') | as_timestamp - 10800 }}

############################################
# STATISTICS SENSOR (MITTELWERT)
############################################
sensor:
  - platform: statistics
    name: "Nettoleistung Netz Mittelwert"
    entity_id: sensor.nettoleistung_netz
    state_characteristic: mean
    sampling_size: 20
    max_age:
      seconds: 120