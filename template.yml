############################################
# TEMPLATE-SENSOREN
############################################
template:
  - sensor:
      # Nettoleistung am Netz (positiv = Einspeisung, negativ = Bezug),
      # bereinigt um Speichereinfluss: Entladung hat Bezug reduziert → addieren,
      # Ladung hat Bezug erhöht → abziehen. So sieht man den "wahren" Haushaltsbedarf.
      - name: "Nettoleistung Netz"
        unit_of_measurement: "W"
        state: >
          {% set netz = states('sensor.sn_3007669104_metering_power_supplied') | float(0)
                      - states('sensor.sn_3007669104_metering_power_absorbed') | float(0) %}
          {% set sp_in = states('sensor.solarflow_2400_ac_output_pack_power') | float(0) %}
          {% set sp_out  = states('sensor.solarflow_2400_ac_pack_input_power') | float(0) %}
          {{ netz - sp_out + sp_in }}

      # Prognose Stunde hoch, wenn Prognose > 1/2 Peak
      - name: "PV Prognose Stunde hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_next_hour') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 2000) }}
          {% endif %}

      # Prognose Heute hoch, wenn Prognose > Peak
      - name: "PV Prognose Heute hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_today_remaining') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 1000) }}
          {% endif %}

      # Prognose Morgen hoch, wenn Prognose > 3 x Peak
      - name: "PV Prognose Morgen hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_tomorrow') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) * 3 / 1000) }}
          {% endif %}

      # Maximale Ladeleistung
      # Strategie: Bei schlechter Prognose aggressiv laden (jede kWh zählt),
      # bei guter Prognose sanfter (schont Batterie, PV kommt noch).
      - name: "Zendure Max Ladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set base = 800 %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_max = states('number.solarflow_2400_ac_soc_set') | float(80) %}
          {% set prog_heute = is_state('sensor.pv_prognose_heute_hoch', 'True') %}
          {% set prog_stunde = is_state('sensor.pv_prognose_stunde_hoch', 'True') %}
          
          {% if soc >= soc_max %}
            0
          {% elif not prog_heute %}
            {# Schlechte Tagesprognose: alles mitnehmen was geht #}
            {{ base }}
          {% elif soc > (soc_max - 10) %}
            {# Gute Prognose, fast voll: sanft laden #}
            {{ (base / 3) | int }}
          {% elif prog_stunde %}
            {# Gute Prognose + viel PV gerade: moderat (es kommt noch mehr) #}
            {{ (base * 2 / 3) | int }}
          {% else %}
            {# Gute Prognose, noch Platz, gerade wenig PV: normal #}
            {{ base }}
          {% endif %}
          
      # Maximale Entladeleistung
      # Strategie: Gute Prognose = großzügig entladen (wird wieder aufgefüllt),
      # schlechte Prognose = konservativ (muss lange reichen).
      # SoC-Nähe zu soc_min drosselt zusätzlich.
      - name: "Zendure Max Entladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set base = 800 %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_min = states('sensor.solarflow_2400_ac_min_soc') | float(10) %}
          {% set prog_heute = is_state('sensor.pv_prognose_heute_hoch', 'True') %}
          {% set prog_morgen = is_state('sensor.pv_prognose_morgen_hoch', 'True') %}
          {% set reserve = soc - soc_min %}
          
          {% if soc <= soc_min %}
            0
          {% elif prog_morgen and reserve > 20 %}
            {# Morgen kommt PV, genug Reserve: volle Leistung #}
            {{ base }}
          {% elif prog_heute and reserve > 15 %}
            {# Heute kommt noch PV: moderate Entladung #}
            {{ (base * 3 / 4) | int }}
          {% elif reserve > 30 %}
            {# Schlechte Prognose aber viel Reserve: halb #}
            {{ (base / 2) | int }}
          {% elif reserve > 10 %}
            {# Wenig Reserve, schlechte Prognose: vorsichtig #}
            {{ (base / 4) | int }}
          {% else %}
            {# Knapp über soc_min: minimal (Notreserve) #}
            {{ (base / 6) | int }}
          {% endif %}

      # Aktueller Steuer-Zustand (spiegelt die choose-Logik aus automation.yml)
      - name: "Zendure Steuerung Status"
        icon: >
          {% set netz = states('sensor.nettoleistung_netz_mittelwert') | float(0) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_min = states('sensor.solarflow_2400_ac_min_soc') | float(10) %}
          {% set soc_max = states('number.solarflow_2400_ac_soc_set') | float(80) %}
          {% set ist_nacht = is_state('binary_sensor.ist_nacht', 'on') %}
          {% set prog_heute = is_state('sensor.pv_prognose_heute_hoch', 'True') %}
          {% set prog_morgen = is_state('sensor.pv_prognose_morgen_hoch', 'True') %}
          {% set deadband = 50 %}
          {% set reserve_offset = 15 %}
          {% set notlade_offset = 10 %}
          {% set erwartet = states('sensor.erwarteter_verbrauch_naechste_periode') | float(300) %}
          {% set reserve_wh = ((soc - soc_min) * 24) | int %}
          {% set n = states('sensor.naechste_tageszeit') %}
          {% set dauer = {'Morgen':4,'Vormittag':2,'Nachmittag':5,'Abend':5,'Nacht':8} %}
          {% set naechste_bedarf_wh = (erwartet * dauer.get(n, 4)) | int %}
          {% if ist_nacht %}
            {% if not prog_heute and not prog_morgen and soc < (soc_min + notlade_offset) %}
              mdi:battery-charging-wireless-alert
            {% elif prog_morgen and soc > soc_min and netz < -deadband %}
              mdi:battery-arrow-down
            {% elif not prog_morgen and soc > (soc_min + reserve_offset) and netz < -deadband %}
              mdi:battery-arrow-down-outline
            {% else %}
              mdi:sleep
            {% endif %}
          {% elif netz > deadband and soc < soc_max %}
            mdi:solar-power
          {% elif netz < -deadband and soc > soc_min %}
            {% if prog_heute or prog_morgen %}
              mdi:battery-minus
            {% elif reserve_wh > naechste_bedarf_wh %}
              mdi:battery-minus-outline
            {% else %}
              mdi:battery-low
            {% endif %}
          {% else %}
            mdi:pause-circle-outline
          {% endif %}
        state: >
          {% set netz = states('sensor.nettoleistung_netz_mittelwert') | float(0) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_min = states('sensor.solarflow_2400_ac_min_soc') | float(10) %}
          {% set soc_max = states('number.solarflow_2400_ac_soc_set') | float(80) %}
          {% set ist_nacht = is_state('binary_sensor.ist_nacht', 'on') %}
          {% set prog_heute = is_state('sensor.pv_prognose_heute_hoch', 'True') %}
          {% set prog_morgen = is_state('sensor.pv_prognose_morgen_hoch', 'True') %}
          {% set deadband = 50 %}
          {% set reserve_offset = 15 %}
          {% set notlade_offset = 10 %}
          {% set erwartet = states('sensor.erwarteter_verbrauch_naechste_periode') | float(300) %}
          {% set reserve_wh = ((soc - soc_min) * 24) | int %}
          {% set n = states('sensor.naechste_tageszeit') %}
          {% set dauer = {'Morgen':4,'Vormittag':2,'Nachmittag':5,'Abend':5,'Nacht':8} %}
          {% set naechste_bedarf_wh = (erwartet * dauer.get(n, 4)) | int %}
          {% if ist_nacht %}
            {% if not prog_heute and not prog_morgen and soc < (soc_min + notlade_offset) %}
              🆘 Nacht – Notladen
            {% elif prog_morgen and soc > soc_min and netz < -deadband %}
              🌙 Nacht – Platz schaffen
            {% elif not prog_morgen and soc > (soc_min + reserve_offset) and netz < -deadband %}
              🌙 Nacht – Schonend entladen
            {% else %}
              🌙 Nacht – Passiv
            {% endif %}
          {% elif netz > deadband and soc < soc_max %}
            ☀️ Tag – Laden
          {% elif netz < -deadband and soc > soc_min %}
            {% if prog_heute or prog_morgen %}
              🟢 Tag – Voll entladen
            {% elif reserve_wh > naechste_bedarf_wh %}
              🟡 Tag – Moderat entladen (Reserve reicht)
            {% else %}
              🔴 Tag – Gedrosselt (Reserve knapp)
            {% endif %}
          {% else %}
            🟰 Passiv (Deadband)
          {% endif %}

  - binary_sensor:
      # Nachtsensor - Sonnenaufgang plus 2std., Sonnenuntergang minus 3std.
      - name: "Ist Nacht"
        state: >
          {{ (states('sensor.sun_next_rising') | as_timestamp + 7200)
            < states('sensor.sun_next_setting') | as_timestamp - 10800 }}

  ############################################
  # TAGESZEIT-BASIERTE VERBRAUCHSANALYSE
  ############################################
  # Zeitfenster:
  #   Morgen:     06:00 – 09:59
  #   Vormittag:  10:00 – 11:59
  #   Nachmittag: 12:00 – 16:59
  #   Abend:      17:00 – 21:59
  #   Nacht:      22:00 – 05:59
  - sensor:
      # Aktuelle Tageszeit als Kategorie
      - name: "Aktuelle Tageszeit"
        icon: mdi:clock-outline
        state: >
          {% set h = now().hour %}
          {% if 6 <= h < 10 %}
            Morgen
          {% elif 10 <= h < 12 %}
            Vormittag
          {% elif 12 <= h < 17 %}
            Nachmittag
          {% elif 17 <= h < 22 %}
            Abend
          {% else %}
            Nacht
          {% endif %}

      # Nächste Tageszeit (für vorausschauende Planung)
      - name: "Naechste Tageszeit"
        icon: mdi:clock-fast
        state: >
          {% set h = now().hour %}
          {% if 6 <= h < 10 %}
            Vormittag
          {% elif 10 <= h < 12 %}
            Nachmittag
          {% elif 12 <= h < 17 %}
            Abend
          {% elif 17 <= h < 22 %}
            Nacht
          {% else %}
            Morgen
          {% endif %}

      # Gefilterte Verbrauchssensoren: nur aktiv in ihrem Zeitfenster.
      # Außerhalb → unavailable, damit der Statistics-Sensor nur passende Werte mittelt.
      - name: "Verbrauch Morgen"
        unit_of_measurement: "W"
        availability: "{{ 6 <= now().hour < 10 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Vormittag"
        unit_of_measurement: "W"
        availability: "{{ 10 <= now().hour < 12 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Nachmittag"
        unit_of_measurement: "W"
        availability: "{{ 12 <= now().hour < 17 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Abend"
        unit_of_measurement: "W"
        availability: "{{ 17 <= now().hour < 22 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Nacht"
        unit_of_measurement: "W"
        availability: "{{ now().hour >= 22 or now().hour < 6 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      # Erwarteter Verbrauch der NÄCHSTEN Tageszeit (7-Tage-Durchschnitt)
      - name: "Erwarteter Verbrauch naechste Periode"
        unit_of_measurement: "W"
        icon: mdi:chart-timeline-variant
        state: >
          {% set naechste = states('sensor.naechste_tageszeit') %}
          {% if naechste == 'Morgen' %}
            {{ states('sensor.durchschnitt_verbrauch_morgen_7d') | float(300) }}
          {% elif naechste == 'Vormittag' %}
            {{ states('sensor.durchschnitt_verbrauch_vormittag_7d') | float(400) }}
          {% elif naechste == 'Nachmittag' %}
            {{ states('sensor.durchschnitt_verbrauch_nachmittag_7d') | float(350) }}
          {% elif naechste == 'Abend' %}
            {{ states('sensor.durchschnitt_verbrauch_abend_7d') | float(500) }}
          {% else %}
            {{ states('sensor.durchschnitt_verbrauch_nacht_7d') | float(200) }}
          {% endif %}

############################################
# STATISTICS SENSOREN
############################################
sensor:
  - platform: statistics
    name: "Nettoleistung Netz Mittelwert"
    entity_id: sensor.nettoleistung_netz
    state_characteristic: mean
    sampling_size: 20
    max_age:
      seconds: 120

  # 7-Tage Durchschnittsverbrauch pro Tageszeit
  - platform: statistics
    name: "Durchschnitt Verbrauch Morgen 7d"
    entity_id: sensor.verbrauch_morgen
    state_characteristic: mean
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Vormittag 7d"
    entity_id: sensor.verbrauch_vormittag
    state_characteristic: mean
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Nachmittag 7d"
    entity_id: sensor.verbrauch_nachmittag
    state_characteristic: mean
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Abend 7d"
    entity_id: sensor.verbrauch_abend
    state_characteristic: mean
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Nacht 7d"
    entity_id: sensor.verbrauch_nacht
    state_characteristic: mean
    max_age:
      days: 7
