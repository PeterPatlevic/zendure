############################################
# TEMPLATE-SENSOREN
############################################
template:
  - sensor:
      # Nettoleistung am Netz (positiv = Einspeisung, negativ = Bezug)
      - name: "Nettoleistung Netz"
        unit_of_measurement: "W"
        state: >
          {{ states('sensor.sn_3007669104_metering_power_supplied') | float(0)
             - states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}

      # Sommer / Winter Profil
      - name: "PV Jahreszeitprofil"
        state: >
          {% set m = now().month %}
          {{ 'Sommer' if 3 <= m <= 10 else 'Winter' }}

      # PV-Erwartung nächste 1–2 Stunden
      - name: "PV Erwartung Kurzfrist"
        unit_of_measurement: "kWh"
        state: >
          {{ states('sensor.energy_current_hour') | float(0)
             + states('sensor.energy_next_hour') | float(0) }}

      # Heute Rest-PV gering?
      - name: "PV Erwartung Heute Gering"
        state: >
          {{ states('sensor.energy_production_today_remaining') | float(0) < 3 }}

      # Morgen viel PV?
      - name: "PV Erwartung Morgen Hoch"
        state: >
          {{ states('sensor.energy_production_tomorow') | float(0) > 15 }}

      # Maximale Entladeleistung (SoC + Prognose)
      - name: "Zendure Max Entladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_min = states('sensor.solarflow_2400_ac_min_soc') | float(0) %}
          {% set pv_heute_gering = is_state('sensor.pv_erwartung_heute_gering', 'True') %}
          {% set pv_morgen_hoch = is_state('sensor.pv_erwartung_morgen_hoch', 'True') %}
          {% if soc <= soc_min %}
            0
          {% elif pv_heute_gering and soc < 60 %}
            200
          {% elif pv_morgen_hoch %}
            800
          {% elif soc < 40 %}
            200
          {% elif soc < 60 %}
            400
          {% elif soc < 80 %}
            600
          {% else %}
            800
          {% endif %}

      # Debug: Warum lädt / entlädt?
      - name: "Zendure Regelstatus"
        icon: >
          {% if is_state('binary_sensor.zendure_nacht', 'on') %}
            mdi:weather-night
          {% elif states('sensor.solarflow_2400_ac_electric_level') | float(0)
                <= states('sensor.zendure_effektives_mindest_soc') | float(0) %}
            mdi:battery-alert
          {% elif states('number.solarflow_2400_ac_input_limit') | int(0) > 0 %}
            mdi:battery-charging
          {% elif states('number.solarflow_2400_ac_output_limit') | int(0) > 0 %}
            mdi:battery-arrow-up
          {% else %}
            mdi:swap-horizontal
          {% endif %}
        state: >
          {% set netz = states('sensor.nettoleistung_netz_mittelwert') | float(0) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_eff = states('sensor.zendure_effektives_mindest_soc') | float(0) %}
          {% set out = states('number.solarflow_2400_ac_output_limit') | int(0) %}
          {% set inp = states('number.solarflow_2400_ac_input_limit') | int(0) %}

          {% if is_state('binary_sensor.zendure_nacht', 'on')
                and out > 0
                and is_state('sensor.pv_erwartung_morgen_hoch', 'True') %}
            Nachtentladung (Platz für PV, {{ out }} W)

          {% elif is_state('binary_sensor.zendure_nacht', 'on')
                and out > 0 %}
            Nachtentladung ({{ out }} W)

          {% elif is_state('binary_sensor.zendure_nacht', 'on') %}
            Nachtbetrieb – Batterie geschützt

          {% elif soc <= soc_eff %}
            Winter‑Safe‑Reserve aktiv

          {% elif inp > 0 %}
            Laden ({{ inp }} W)

          {% elif out > 0 %}
            Entladen ({{ out }} W)

          {% elif -80 < netz < 80 %}
            Neutralbereich (Netz ≈ 0)

          {% else %}
            Bereitschaft
          {% endif %}

          
      # Winterseserve
      - name: "Zendure Effektives Mindest-SoC"
        unit_of_measurement: "%"
        state: >
          {% set soc_min = states('number.solarflow_2400_ac_min_soc') | float(0) %}
          {% set reserve = states('input_number.zendure_winter_reserve') | float(0) %}
          {% set profil = states('sensor.pv_jahreszeitprofil') %}

          {% if profil == 'Winter' %}
            {{ soc_min + reserve }}
          {% else %}
            {{ soc_min }}
          {% endif %}

  - binary_sensor:
      # Nachtsensor
      - name: "Zendure Nacht"
        state: >
          {{ now().hour >= 22 or now().hour < 6 }}


############################################
# STATISTICS SENSOR (MITTELWERT)
############################################
sensor:
  - platform: statistics
    name: "Nettoleistung Netz Mittelwert"
    entity_id: sensor.nettoleistung_netz
    state_characteristic: mean
    sampling_size: 20
    max_age:
      seconds: 120