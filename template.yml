############################################
# TEMPLATE-SENSOREN
############################################
template:
  - sensor:
      # Nettoleistung am Netz (positiv = Einspeisung, negativ = Bezug)
      - name: "Nettoleistung Netz"
        unit_of_measurement: "W"
        state: >
          {{ states('sensor.sn_3007669104_metering_power_supplied') | float(0)
             - states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}

      # Prognose Heute hoch, wenn Prognose > Peak
      - name: "PV Prognose Heute hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_today_remaining') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 1000) }}
          {% endif %}

      # Prognose Morgen hoch, wenn Prognose > 3 x Peak
      - name: "PV Prognose Morgen hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_tomorrow') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) * 3 / 1000) }}
          {% endif %}

      # Maximale Ladeleistung (SoC)
      - name: "Zendure Max Ladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set max = float(800) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_max = states('number.solarflow_2400_ac_soc_set') | float(0) %}
          {% set pv_heute_hoch = is_state('sensor.pv_prognose_heute_hoch', 'True') %}
          
          {% if soc >= soc_max %}
            0
          {% elif pv_heute_hoch and soc > 60 %}
            {{ max / 2 }}
          {% elif pv_heute_hoch %}
            {{ max * 3 / 2 }}
          {% else %}
            {{ max }}
          {% endif %}
          
      # Maximale Entladeleistung (SoC + Prognose)
      - name: "Zendure Max Entladeleistung"
        unit_of_measurement: "W"
        state: >
          {% set max = float(800) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_min = states('sensor.solarflow_2400_ac_min_soc') | float(0) %}
          {% set pv_heute_gering = is_state('sensor.pv_prognose_heute_hoch', 'False') %}
          {% set pv_morgen_gering = is_state('sensor.pv_prognose_morgen_hoch', 'False') %}
          
          {% if soc <= soc_min %}
            0
          {% elif not pv_heute_gering and not pv_morgen_gering and soc > 40 %}
            {{ max }}
          {% elif not pv_heute_gering and not pv_morgen_gering %}
            {{ max * 3 / 4 }}
          {% elif not pv_heute_gering and soc > 50 %}
            {{ max * 2 / 3 }}
          {% elif pv_heute_gering and soc > 60 %}
            {{ max / 2 }}
          {% elif pv_heute_gering %}
            {{ max / 3 }}
          {% else %}
            {{ max / 4 }}
          {% endif %}

      # Debug: Warum lädt / entlädt?
      - name: "Zendure Regelstatus"
        icon: >
          {% if is_state('binary_sensor.zendure_nacht', 'on') %}
            mdi:weather-night
          {% elif states('sensor.solarflow_2400_ac_electric_level') | float(0)
                <= states('sensor.zendure_effektives_mindest_soc') | float(0) %}
            mdi:battery-alert
          {% elif states('number.solarflow_2400_ac_input_limit') | int(0) > 0 %}
            mdi:battery-charging
          {% elif states('number.solarflow_2400_ac_output_limit') | int(0) > 0 %}
            mdi:battery-arrow-up
          {% else %}
            mdi:swap-horizontal
          {% endif %}
        state: >
          {% set netz = states('sensor.nettoleistung_netz_mittelwert') | float(0) %}
          {% set soc = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
          {% set soc_eff = states('sensor.zendure_effektives_mindest_soc') | float(0) %}
          {% set out = states('number.solarflow_2400_ac_output_limit') | int(0) %}
          {% set inp = states('number.solarflow_2400_ac_input_limit') | int(0) %}

          {% if is_state('binary_sensor.zendure_nacht', 'on') and out > 0
            and is_state('sensor.pv_erwartung_morgen_hoch', 'True') %}
            Nachtentladung (Platz für PV, {{ out }} W)
          {% elif is_state('binary_sensor.zendure_nacht', 'on') and out > 0 %}
            Nachtentladung ({{ out }} W)
          {% elif is_state('binary_sensor.zendure_nacht', 'on') %}
            Nachtbetrieb – Batterie geschützt
          {% elif soc <= soc_eff %}
            Winter‑Safe‑Reserve aktiv
          {% elif inp > 0 %}
            Laden ({{ inp }} W)
          {% elif out > 0 %}
            Entladen ({{ out }} W)
          {% elif -80 < netz < 80 %}
            Neutralbereich (Netz ≈ 0)
          {% else %}
            Bereitschaft
          {% endif %}

  - binary_sensor:
      # Nachtsensor - Sonnenaufgang plus 2std., Sonnenuntergang minus 3std.
      - name: "Ist Nacht"
        state: >
          {{ (states('sensor.sun_next_rising') | as_timestamp + 7200)
            < states('sensor.sun_next_setting') | as_timestamp - 10800 }}

############################################
# STATISTICS SENSOR (MITTELWERT)
############################################
sensor:
  - platform: statistics
    name: "Nettoleistung Netz Mittelwert"
    entity_id: sensor.nettoleistung_netz
    state_characteristic: mean
    sampling_size: 20
    max_age:
      seconds: 120