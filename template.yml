############################################
# TEMPLATE-SENSOREN
############################################
template:
  - sensor:
      # Nettoleistung am Netz (positiv = Einspeisung, negativ = Bezug),
      # bereinigt um Speichereinfluss: Entladung hat Bezug reduziert → addieren,
      # Ladung hat Bezug erhöht → abziehen. So sieht man den "wahren" Haushaltsbedarf.
      - name: "Nettoleistung Netz"
        unit_of_measurement: "W"
        state: >
          {% set netz = states('sensor.sn_3007669104_metering_power_supplied') | float(0)
                      - states('sensor.sn_3007669104_metering_power_absorbed') | float(0) %}
          {% set sp_in = states('sensor.solarflow_2400_ac_output_pack_power') | float(0) %}
          {% set sp_out  = states('sensor.solarflow_2400_ac_pack_input_power') | float(0) %}
          {{ netz - sp_out + sp_in }}

      # Prognose Stunde hoch, wenn Prognose > 1/2 Peak
      - name: "PV Prognose Stunde hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_next_hour') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 2000) }}
          {% endif %}

      # Prognose heute hoch, wenn Prognose > Peak
      - name: "PV Prognose Heute hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_today_remaining') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) / 1000) }}
          {% endif %}

      # Prognose Morgen hoch, wenn Prognose > 3 x Peak
      - name: "PV Prognose Morgen hoch"
        icon: mdi:solar-power
        state: >
          {% set prognose = states('sensor.energy_production_tomorrow') %}
          {% set peak = states('input_number.pv_peak_leistung') %}
          {% if prognose in ['unknown','unavailable'] or peak in ['unknown','unavailable'] %}
            false
          {% else %}
            {{ (prognose | float) >= ((peak | float) * 3 / 1000) }}
          {% endif %}

      # Maximale Ladeleistung
      # Strategie: Bei schlechter Prognose aggressiv laden (jede kWh zählt),
      # bei guter Prognose sanfter (schont Batterie, PV kommt noch).
      # Wert + Status + Icon werden im selben Sensor berechnet (Wert = state,
      # Status/Icon als Attribute). "Zendure Max Ladeleistung Status" liest sie.
      - name: "Zendure Max Ladeleistung"
        unit_of_measurement: "W"

        variables:
            base: 800
            soc: "{{ states('sensor.solarflow_2400_ac_electric_level') | float(0) }}"
            soc_max: "{{ states('number.solarflow_2400_ac_soc_set') | float(80) }}"
            prog_heute: "{{ is_state('sensor.pv_prognose_heute_hoch', 'True') }}"
            prog_stunde: "{{ is_state('sensor.pv_prognose_stunde_hoch', 'True') }}"

            result: >
              {% if soc >= soc_max %}
                {{ dict(cap = 0,
                        status = '🚫 Voll – kein Laden',
                        icon = 'mdi:battery-check') }}
              {% elif not prog_heute %}
                {{ dict(cap = base,
                        status = '🚀 Aggressiv – schlechte Prognose',
                        icon = 'mdi:battery-charging-high') }}
              {% elif soc > (soc_max - 10) %}
                {{ dict(cap = (base / 3) | int,
                        status = '🐢 Sanft – fast voll',
                        icon = 'mdi:battery-charging-low') }}
              {% elif prog_stunde %}
                {{ dict(cap = (base * 2 / 3) | int,
                        status = '🐇 Moderat – viel PV erwartet',
                        icon = 'mdi:battery-charging-medium') }}
              {% else %}
                {{ dict(cap = base,
                        status = '⚡ Normal – Standardrate',
                        icon = 'mdi:battery-charging') }}
              {% endif %}

        state: "{{ result.cap }}"

        attributes:
          status: "{{ result.status }}"
          icon: "{{ result.icon }}"

      # Status-Sensor zur Max Ladeleistung: liest die Attribute des Wert-Sensors.
      - name: "Zendure Max Ladeleistung Status"
        state: "{{ state_attr('sensor.zendure_max_ladeleistung', 'status') | trim }}"
        icon:  "{{ state_attr('sensor.zendure_max_ladeleistung', 'icon') | trim }}"

      # Maximale Entladeleistung – siehe oben (Status/Icon als Attribute).
      # Strategie: Gute Prognose = großzügig entladen (wird wieder aufgefüllt),
      # schlechte Prognose = konservativ (muss lange reichen).
      # SoC-Nähe zu soc_min drosselt zusätzlich.
      # Optional (Schalter input_boolean.zendure_verbrauchsprognose):
      #   AN + Reserve im Speicher < geschätzter Bedarf nächste Periode
      #   + keine PV-Prognose-Hilfe -> zusätzliches Cap auf base/4 (200 W).
      - name: "Zendure Max Entladeleistung"
        unit_of_measurement: "W"

        variables:
          base: 800

          soc: "{{ states('sensor.solarflow_2400_ac_electric_level') | float(0) }}"
          soc_min: "{{ states('sensor.solarflow_2400_ac_min_soc') | float(10) }}"

          prog_heute: "{{ is_state('sensor.pv_prognose_heute_hoch', 'True') }}"
          prog_morgen: "{{ is_state('sensor.pv_prognose_morgen_hoch', 'True') }}"

          reserve: "{{ soc - soc_min }}"

          use_verbrauch: "{{ is_state('input_boolean.zendure_verbrauchsprognose', 'on') }}"

          kapazitaet_wh: "{{ states('sensor.solarflow_2400_ac_total_kwh') | float(2.88) * 1000 }}"
          reserve_wh: "{{ (reserve / 100 * kapazitaet_wh) | int }}"

          erwartet: "{{ states('sensor.erwarteter_verbrauch_naechste_periode') | float(300) }}"
          tageszeit: "{{ states('sensor.naechste_tageszeit') }}"
          dauer: "{{ {'Morgen':4,'Vormittag':2,'Nachmittag':5,'Abend':5,'Nacht':8}.get(tageszeit, 4) }}"
          bedarf_wh: "{{ (erwartet * dauer) | int }}"

          verbrauch_cap: >
            {{ use_verbrauch
               and not prog_heute
               and not prog_morgen
               and reserve_wh < bedarf_wh }}

          result: >
            {% if soc <= soc_min %}
              {{ dict(cap=0,
                      status='🚫 Leer – kein Entladen',
                      icon='mdi:battery-off') }}

            {% elif prog_morgen and reserve > 20 %}
              {{ dict(cap=base,
                      status='🚀 Voll – Morgen kommt PV',
                      icon='mdi:battery-high') }}

            {% elif prog_heute and reserve > 15 %}
              {{ dict(cap=(base * 3 / 4) | int,
                      status='🟢 Moderat – Heute kommt PV',
                      icon='mdi:battery-medium') }}

            {% elif verbrauch_cap and reserve > 30 %}
              {{ dict(cap=(base / 4) | int,
                      status='🛡️ Verbrauchs-Cap (25%)',
                      icon='mdi:shield-half-full') }}

            {% elif reserve > 30 %}
              {{ dict(cap=(base / 2) | int,
                      status='🟡 Halb – viel Reserve',
                      icon='mdi:battery-50') }}

            {% elif reserve > 10 %}
              {{ dict(cap=(base / 4) | int,
                      status='🟠 Vorsichtig – wenig Reserve',
                      icon='mdi:battery-low') }}

            {% else %}
              {{ dict(cap=(base / 6) | int,
                      status='🔴 Notreserve – knapp über Min',
                      icon='mdi:battery-alert') }}
            {% endif %}

        state: "{{ result.cap }}"

        attributes:
          status: "{{ result.status }}"
          icon: "{{ result.icon }}"

      # Status-Sensor zur Max Entladeleistung: liest die Attribute des Wert-Sensors.
      - name: "Zendure Max Entladeleistung Status"
        state: "{{ state_attr('sensor.zendure_max_entladeleistung', 'status') | trim }}"
        icon:  "{{ state_attr('sensor.zendure_max_entladeleistung', 'icon') | trim }}"

      # Aktueller Steuer-Zustand: spiegelt EXAKT den zuletzt ausgeführten
      # Branch der automation.yml. Quelle: input_text.zendure_status
      # (wird in jedem choose-Zweig als erste Aktion gesetzt).
      - name: "Zendure Steuerung Status"
        state: "{{ states('input_text.zendure_status') }}"
        icon: >
          {% set s = states('input_text.zendure_status') %}
          {% if 'Notladen' in s %}              mdi:battery-charging-wireless-alert
          {% elif 'Platz schaffen' in s %}      mdi:battery-arrow-down
          {% elif 'Schonend' in s %}            mdi:battery-arrow-down-outline
          {% elif 'Nacht – Passiv' in s %}      mdi:sleep
          {% elif 'Tag – Laden' in s %}         mdi:solar-power
          {% elif 'gute Prognose' in s %}       mdi:battery-minus
          {% elif 'gedrosselt' in s %}          mdi:battery-minus-outline
          {% elif 'Deadband' in s %}            mdi:pause-circle-outline
          {% else %}                            mdi:help-circle-outline
          {% endif %}

  - binary_sensor:
      # Nachtsensor: "Nacht" = Sonnenuntergang -3h ... Sonnenaufgang +2h
      # nutzt sun.sun Attribute (immer ISO mit Zeitzone) und vergleicht mit now().
      # Robust gegenüber Zeitzonen, da as_timestamp intern UTC nutzt.
      - name: "Ist Nacht"
        state: >
          {% set sunrise = as_timestamp(state_attr('sun.sun', 'next_rising')) %}
          {% set sunset  = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
          {% set now_ts  = as_timestamp(now()) %}
          {% if sunrise < sunset %}
            {# Sonne ist unten -> aktuell Nacht, bis sunrise + 2h #}
            {{ now_ts < (sunrise + 7200) }}
          {% else %}
            {# Sonne ist oben -> Nacht beginnt wieder ab sunset - 3h #}
            {{ now_ts > (sunset - 10800) }}
          {% endif %}

  ############################################
  # TAGESZEIT-BASIERTE VERBRAUCHSANALYSE
  ############################################
  # Zeitfenster:
  #   Morgen:     06:00 – 09:59
  #   Vormittag:  10:00 – 11:59
  #   Nachmittag: 12:00 – 16:59
  #   Abend:      17:00 – 21:59
  #   Nacht:      22:00 – 05:59
  - sensor:
      # Aktuelle Tageszeit als Kategorie
      - name: "Aktuelle Tageszeit"
        icon: mdi:clock-outline
        state: >
          {% set h = now().hour %}
          {% if 6 <= h < 10 %}
            Morgen
          {% elif 10 <= h < 12 %}
            Vormittag
          {% elif 12 <= h < 17 %}
            Nachmittag
          {% elif 17 <= h < 22 %}
            Abend
          {% else %}
            Nacht
          {% endif %}

      # Nächste Tageszeit (für vorausschauende Planung)
      - name: "Naechste Tageszeit"
        icon: mdi:clock-fast
        state: >
          {% set h = now().hour %}
          {% if 6 <= h < 10 %}
            Vormittag
          {% elif 10 <= h < 12 %}
            Nachmittag
          {% elif 12 <= h < 17 %}
            Abend
          {% elif 17 <= h < 22 %}
            Nacht
          {% else %}
            Morgen
          {% endif %}

      # Gefilterte Verbrauchssensoren: nur aktiv in ihrem Zeitfenster.
      # Außerhalb → unavailable, damit der Statistics-Sensor nur passende Werte mittelt.
      - name: "Verbrauch Morgen"
        unit_of_measurement: "W"
        availability: "{{ 6 <= now().hour < 10 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Vormittag"
        unit_of_measurement: "W"
        availability: "{{ 10 <= now().hour < 12 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Nachmittag"
        unit_of_measurement: "W"
        availability: "{{ 12 <= now().hour < 17 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Abend"
        unit_of_measurement: "W"
        availability: "{{ 17 <= now().hour < 22 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      - name: "Verbrauch Nacht"
        unit_of_measurement: "W"
        availability: "{{ now().hour >= 22 or now().hour < 6 }}"
        state: "{{ states('sensor.sn_3007669104_metering_power_absorbed') | float(0) }}"

      # Erwarteter Verbrauch der NÄCHSTEN Tageszeit (7-Tage-Durchschnitt)
      - name: "Erwarteter Verbrauch naechste Periode"
        unit_of_measurement: "W"
        icon: mdi:chart-timeline-variant
        state: >
          {% set naechste = states('sensor.naechste_tageszeit') %}
          {% if naechste == 'Morgen' %}
            {{ states('sensor.durchschnitt_verbrauch_morgen_7d') | float(300) }}
          {% elif naechste == 'Vormittag' %}
            {{ states('sensor.durchschnitt_verbrauch_vormittag_7d') | float(400) }}
          {% elif naechste == 'Nachmittag' %}
            {{ states('sensor.durchschnitt_verbrauch_nachmittag_7d') | float(350) }}
          {% elif naechste == 'Abend' %}
            {{ states('sensor.durchschnitt_verbrauch_abend_7d') | float(500) }}
          {% else %}
            {{ states('sensor.durchschnitt_verbrauch_nacht_7d') | float(200) }}
          {% endif %}

############################################
# STATISTICS SENSOREN
############################################
sensor:
  - platform: statistics
    name: "Nettoleistung Netz Mittelwert"
    entity_id: sensor.nettoleistung_netz
    state_characteristic: mean
    sampling_size: 20
    max_age:
      seconds: 120

  # 7-Tage Durchschnittsverbrauch pro Tageszeit
  - platform: statistics
    name: "Durchschnitt Verbrauch Morgen 7d"
    entity_id: sensor.verbrauch_morgen
    state_characteristic: mean
    sampling_size: 10000
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Vormittag 7d"
    entity_id: sensor.verbrauch_vormittag
    state_characteristic: mean
    sampling_size: 10000
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Nachmittag 7d"
    entity_id: sensor.verbrauch_nachmittag
    state_characteristic: mean
    sampling_size: 10000
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Abend 7d"
    entity_id: sensor.verbrauch_abend
    state_characteristic: mean
    sampling_size: 10000
    max_age:
      days: 7

  - platform: statistics
    name: "Durchschnitt Verbrauch Nacht 7d"
    entity_id: sensor.verbrauch_nacht
    state_characteristic: mean
    sampling_size: 10000
    max_age:
      days: 7
