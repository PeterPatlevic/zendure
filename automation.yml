###############################################################################
# Zendure SolarFlow 2400 AC – Automatik mit PV-Prognose
#
# Ziele (siehe AGENTS.md):
#   - Möglichst wenig Netzbezug
#   - Tag mit PV-Überschuss   -> Speicher füllen
#   - Tag mit Netzbezug       -> Speicher entladen, Aggressivität je Prognose
#   - Nacht                   -> Speicher entleeren, NIE aus dem Netz laden
#   - Schlechte Prognose      -> Speicher schonen (Reserve halten)
#   - Gute Prognose           -> Speicher voll nutzen
###############################################################################
alias: Zendure SolarFlow AC – Automatik mit Prognose
mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
    seconds: "0"

variables:
  # Geglättete Netto-Netzleistung (bereits speicherbereinigt, s. template.yml)
  # + Einspeisung / - Bezug
  netz:        "{{ states('sensor.nettoleistung_netz_mittelwert') | float(0) }}"
  soc:         "{{ states('sensor.solarflow_2400_ac_electric_level') | float(0) }}"
  soc_min:     "{{ states('sensor.solarflow_2400_ac_min_soc')       | float(10) }}"
  soc_max:     "{{ states('number.solarflow_2400_ac_soc_set')       | float(80) }}"
  max_lade:    "{{ states('sensor.zendure_max_ladeleistung')        | int(800) }}"
  max_entlade: "{{ states('sensor.zendure_max_entladeleistung')     | int(800) }}"

  # Prognose-Flags: states sind Strings 'True'/'False' (s. template.yml)
  ist_nacht:        "{{ is_state('binary_sensor.ist_nacht', 'on') }}"
  prog_stunde_hoch: "{{ is_state('sensor.pv_prognose_stunde_hoch', 'True') }}"
  prog_heute_hoch:  "{{ is_state('sensor.pv_prognose_heute_hoch',  'True') }}"
  prog_morgen_hoch: "{{ is_state('sensor.pv_prognose_morgen_hoch', 'True') }}"

  # Hysterese um 0 W, verhindert Pendeln zwischen input/output
  deadband: 50
  # Mindestreserve über soc_min bei schlechter Morgen-Prognose
  reserve_offset: 15
  # Notlade-Schwelle (über soc_min) bei schlechter Heute+Morgen-Prognose
  notlade_offset: 10
  notlade_power: 200

action:
  - choose:

      # =========================================================================
      # 🌙 NACHT
      #   - Notladen   -> Heute & Morgen schlecht & SoC kritisch -> aus Netz laden
      #   - Morgen hoch-> aggressiv bis soc_min leeren (Platz für PV)
      #   - sonst      -> Reserve halten, schonend entladen
      # =========================================================================
      - conditions: "{{ ist_nacht }}"
        sequence:
          - choose:

              # 🆘 Notladen aus Netz: Heute & Morgen schlecht & SoC kritisch
              - conditions: >
                  {{ not prog_heute_hoch
                     and not prog_morgen_hoch
                     and soc < (soc_min + notlade_offset) }}
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: select.solarflow_2400_ac_ac_mode
                    data:
                      option: "input"
                  - service: number.set_value
                    target:
                      entity_id: number.solarflow_2400_ac_input_limit
                    data:
                      value: "{{ [notlade_power, max_lade] | min | int }}"

              # Morgen viel PV erwartet -> Platz schaffen
              - conditions: >
                  {{ prog_morgen_hoch
                     and soc > soc_min
                     and netz < -deadband }}
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: select.solarflow_2400_ac_ac_mode
                    data:
                      option: "output"
                  - service: number.set_value
                    target:
                      entity_id: number.solarflow_2400_ac_output_limit
                    data:
                      value: "{{ min(abs(netz), max_entlade) | int }}"

              # Morgen wenig PV -> Reserve über soc_min halten, halbe Leistung
              - conditions: >
                  {{ not prog_morgen_hoch
                     and soc > (soc_min + reserve_offset)
                     and netz < -deadband }}
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: select.solarflow_2400_ac_ac_mode
                    data:
                      option: "output"
                  - service: number.set_value
                    target:
                      entity_id: number.solarflow_2400_ac_output_limit
                    data:
                      value: "{{ min(abs(netz / 2), max_entlade) | int }}"

            # Default in der Nacht: passiv (kein Laden aus Netz, kein Entladen)
            default:
              - service: number.set_value
                target:
                  entity_id: number.solarflow_2400_ac_input_limit
                data:
                  value: 0
              - service: number.set_value
                target:
                  entity_id: number.solarflow_2400_ac_output_limit
                data:
                  value: 0

      # =========================================================================
      # ☀️ TAG – PV-Überschuss -> laden
      # =========================================================================
      - conditions: "{{ netz > deadband and soc < soc_max }}"
        sequence:
          - service: select.select_option
            target:
              entity_id: select.solarflow_2400_ac_ac_mode
            data:
              option: "input"
          - service: number.set_value
            target:
              entity_id: number.solarflow_2400_ac_input_limit
            data:
              value: "{{ min(abs(netz * 3 / 4), max_lade) | int }}"

      # =========================================================================
      # 🟢 TAG – Netzbezug -> entladen, Aggressivität nach Prognose + Verbrauch
      # =========================================================================
      - conditions: "{{ netz < -deadband and soc > soc_min }}"
        sequence:
          - variables:
              # Erwarteter Verbrauch der nächsten Tageszeit (7d-Schnitt in W)
              erwartet: "{{ states('sensor.erwarteter_verbrauch_naechste_periode') | float(300) }}"
              # Verfügbare Energie im Speicher über soc_min
              # Gesamtkapazität aus sensor.solarflow_2400_ac_total_kwh (kWh → Wh)
              kapazitaet_wh: "{{ states('sensor.solarflow_2400_ac_total_kwh') | float(2.88) * 1000 }}"
              reserve_wh: "{{ ((soc - soc_min) / 100 * kapazitaet_wh) | int }}"
              # Dauer der nächsten Periode in Stunden (Durchschnitt ~4h)
              naechste_dauer: >
                {% set n = states('sensor.naechste_tageszeit') %}
                {% if n == 'Morgen' %}4{% elif n == 'Vormittag' %}2{% elif n == 'Nachmittag' %}5{% elif n == 'Abend' %}5{% else %}8{% endif %}
              # Geschätzter Bedarf der nächsten Periode (Wh)
              naechste_bedarf_wh: "{{ (erwartet * naechste_dauer | float) | int }}"
          - service: select.select_option
            target:
              entity_id: select.solarflow_2400_ac_ac_mode
            data:
              option: "output"
          - service: number.set_value
            target:
              entity_id: number.solarflow_2400_ac_output_limit
            data:
              value: >
                {% if prog_heute_hoch or prog_morgen_hoch %}
                  {# Gute Prognose: voll entladen, wird wieder aufgefüllt #}
                  {{ min(abs(netz), max_entlade) | int }}
                {% elif reserve_wh > naechste_bedarf_wh %}
                  {# Genug Reserve für nächste Periode: moderat entladen #}
                  {{ min(abs(netz * 2 / 3), max_entlade) | int }}
                {% else %}
                  {# Reserve knapp für nächste Periode: stark drosseln #}
                  {{ min(abs(netz / 3), max_entlade) | int }}
                {% endif %}

    # ===========================================================================
    # 🟰 Default – Deadband oder SoC-Grenze: Speicher passiv
    # ===========================================================================
    default:
      - service: number.set_value
        target:
          entity_id: number.solarflow_2400_ac_input_limit
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.solarflow_2400_ac_output_limit
        data:
          value: 0