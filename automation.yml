alias: Zendure SolarFlow AC – Automatik mit Prognose DEV
mode: single

trigger:
  - platform: time_pattern
    minutes: "/1"
    seconds: "0"

variables:
  netz: "{{ states('sensor.nettoleistung_netz_mittelwert') | float(0) }}"
  soc: "{{ states('sensor.solarflow_2400_ac_electric_level') | float(0) }}"
  soc_min: "{{ states('sensor.solarflow_2400_ac_min_soc') | float(10) }}"
  soc_max: "{{ states('number.solarflow_2400_ac_soc_set') | float(80) }}"
  max_lade: "{{ states('sensor.zendure_max_ladeleistung') | int(333) }}"
  max_entlade: "{{ states('sensor.zendure_max_entladeleistung') | int(222) }}"

action:
  - choose:
      # 🌙 Prognoseabhängige Nachtlogik
      - conditions: "{{ is_state('binary_sensor.ist_nacht', 'on') }}"
        sequence:
          - choose:
              # 🌞 Morgen viel PV → bewusst Platz schaffen
              - conditions: >
                  {{ is_state('sensor.pv_prognose_morgen_hoch', 'True')
                     and soc > soc_min }}
                sequence:
                  - choose:
                      - conditions: "{{ netz >= 0 or soc <= soc_min }}"
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: number.solarflow_2400_ac_input_limit
                            data:
                              value: 0
                          - service: number.set_value
                            target:
                              entity_id: number.solarflow_2400_ac_output_limit
                            data:
                              value: 0
                              
                      - conditions: "{{ netz < 0 }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: select.solarflow_2400_ac_ac_mode
                            data:
                              option: "output"
                          - service: number.set_value
                            target:
                              entity_id: number.solarflow_2400_ac_output_limit
                            data:
                              value: >
                                {{ min(abs(netz * 2 / 3), max_entlade) }}
                              
              # 🌥️ Heute wenig Rest + morgen wenig PV → schonen
              - conditions: >
                  {{ is_state('sensor.pv_prognose_heute_hoch', 'False')
                     and is_state('sensor.pv_prognose_morgen_hoch', 'False') }}
                sequence:
                  - choose:
                      - conditions: "{{ netz >= -50 or soc <= soc_min }}"
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: number.solarflow_2400_ac_input_limit
                            data:
                              value: 0
                          - service: number.set_value
                            target:
                              entity_id: number.solarflow_2400_ac_output_limit
                            data:
                              value: 0
                              
                      - conditions: "{{ netz < -50 }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: select.solarflow_2400_ac_ac_mode
                            data:
                              option: "output"
                          - service: number.set_value
                            target:
                              entity_id: number.solarflow_2400_ac_output_limit
                            data:
                              value: >
                                {{ min(abs(netz / 2), max_entlade)

            # ⚖️ Normalfall in der Nacht
            default:
                - choose:
                  - conditions: "{{ soc <= soc_min }}"
                    sequence:
                      - service: number.set_value
                        target:
                          entity_id: number.solarflow_2400_ac_input_limit
                        data:
                          value: 0
                      - service: number.set_value
                        target:
                          entity_id: number.solarflow_2400_ac_output_limit
                        data:
                          value: 0

                  - conditions: "{{ netz > 0 }}"
                    sequence:
                      - service: select.select_option
                        target:
                          entity_id: select.solarflow_2400_ac_ac_mode
                        data:
                          option: "input"
                      - service: number.set_value
                        target:
                          entity_id: number.solarflow_2400_ac_intput_limit
                        data:
                          value: >
                            {{ min(abs(netz * 3 / 4), max_lade)

                  - conditions: "{{ netz < 0 }}"
                    sequence:
                      - service: select.select_option
                        target:
                          entity_id: select.solarflow_2400_ac_ac_mode
                        data:
                          option: "output"
                      - service: number.set_value
                        target:
                          entity_id: number.solarflow_2400_ac_output_limit
                        data:
                          value: >
                            {{ min(abs(netz * 3 / 4), max_entlade)

      # 🔴 Laden (Netzbezug oder schlechte Prognose)
      - conditions: >
          {{ (netz > 100 and soc < soc_max
            or (is_state('sensor.pv_prognose_morgen_hoch', 'False') and soc < 25)) }}
        sequence:
          - service: select.select_option
            target:
              entity_id: select.solarflow_2400_ac_ac_mode
            data:
              option: "input"
          - service: number.set_value
            target:
              entity_id: number.solarflow_2400_ac_input_limit
            data:
              value: >
                {{ min(abs(netz * 3 / 4), max_lade) }}

      # 🟢 Entladen (SoC + Prognose-abhängig)
      - conditions: "{{ netz < 0 and soc > soc_min }}"
        sequence:
          - service: select.select_option
            target:
              entity_id: select.solarflow_2400_ac_ac_mode
            data:
              option: "output"
          - service: number.set_value
            target:
              entity_id: number.solarflow_2400_ac_output_limit
            data:
              value: >
                {{ min(abs(netz), max_entlade) }}